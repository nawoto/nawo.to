name: Lint Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Diagnostic audit and formatting preview
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e 'const a=require("/tmp/npm-audit.json"); console.log("AUDIT SUMMARY",JSON.stringify(a.metadata?.vulnerabilities)); for (const [name,v] of Object.entries(a.vulnerabilities||{})) { if (v.severity === "high" || v.severity === "critical") console.log("AUDIT HIGH",JSON.stringify({name,severity:v.severity,via:v.via,range:v.range,fixAvailable:v.fixAvailable})); }'
          npx prettier --write src/layouts/ArticleLayout.astro src/pages/404.astro
          git diff -- src/layouts/ArticleLayout.astro src/pages/404.astro

      - name: Check code formatting
        run: npm run format:check

      - name: Run lint check
        run: npm run lint:check

      - name: Check Astro types
        run: npm run check

      - name: Check for duplicate code
        run: npm run duplicate
